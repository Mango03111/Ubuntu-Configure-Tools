<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTLab 用量统计</title>
  <style>
    :root {
      --bg: #071019;
      --panel: #111f2d;
      --border: #294052;
      --text: #e7f0f7;
      --muted: #8da1b2;
      --cyan: #71bad6;
      --green: #67c19d;
      --green-soft: rgba(103, 193, 157, 0.12);
      --red: #ff7180;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px system-ui, sans-serif;
    }

    .dashboard {
      max-width: 1680px;
      margin: auto;
      padding: 20px;
    }

    .topbar,
    .panel,
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .topbar a {
      color: var(--cyan);
      margin-right: 14px;
    }

    .connection-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 12px;
      font-weight: 650;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 4px rgba(141, 161, 178, 0.08);
    }

    .connection-state[data-state="online"] {
      color: var(--green);
      border-color: rgba(103, 193, 157, 0.25);
      background: var(--green-soft);
    }

    .connection-state[data-state="online"] .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(103, 193, 157, 0.1), 0 0 12px rgba(103, 193, 157, 0.55);
    }

    .connection-state[data-state="offline"] {
      color: var(--red);
      border-color: rgba(255, 113, 128, 0.28);
      background: rgba(255, 113, 128, 0.11);
    }

    .connection-state[data-state="offline"] .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255, 113, 128, 0.1);
    }

    .connection-state[data-state="connecting"] .status-dot {
      animation: status-pulse 1.2s ease-in-out infinite;
    }

    @keyframes status-pulse {
      50% { opacity: 0.35; transform: scale(0.76); }
    }

    .note,
    .label,
    .sub {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(150px, 1fr));
      gap: 12px;
    }

    .card {
      padding: 18px;
      min-width: 0;
      overflow: hidden;
    }

    .label {
      font-size: 12px;
    }

    .value {
      font: 700 25px ui-monospace, monospace;
      margin-top: 9px;
      white-space: nowrap;
    }

    .model-value {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: clip;
    }

    .model-scroll {
      width: max-content;
      animation: model-marquee 12s linear infinite;
    }

    .model-value.model-scroll {
      animation-duration: 6s;
    }

    @keyframes model-marquee {
      from {
        transform: translateX(var(--model-start, 100%));
      }

      to {
        transform: translateX(var(--model-end, -100%));
      }
    }

    .section {
      margin-top: 24px;
    }

    .section h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .panel {
      padding: 16px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    #trend-range {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1a26;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 5px 8px;
    }

    .legend {
      display: flex;
      gap: 18px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .chart {
      width: 100%;
      height: 320px;
    }

    .error {
      color: var(--red);
      margin-top: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="topbar">
      <div>
        <h1>ANTLab 用量统计</h1>
        <div class="note">所有用户总量 · 分时段增量写入 CSV</div>
      </div>
      <nav>
        <a href="/">性能展示</a>
        <div class="connection-state" id="status" data-state="connecting" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-label">连接中</span>
        </div>
      </nav>
    </header>

    <section>
      <h2>累计使用量</h2>
      <div class="grid">
        <div class="card">
          <div class="label">累计请求</div>
          <div class="value" id="requests">--</div>
        </div>
        <div class="card">
          <div class="label">输入 tokens</div>
          <div class="value" id="input">--</div>
        </div>
        <div class="card">
          <div class="label">输出 tokens</div>
          <div class="value" id="output">--</div>
        </div>
        <div class="card">
          <div class="label">总 tokens</div>
          <div class="value" id="total">--</div>
        </div>
        <div class="card">
          <div class="label">累计费用</div>
          <div class="value" id="cost">--</div>
        </div>
        <div class="card">
          <div class="label">模型</div>
          <div class="value model-value" id="model" title="--">--</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>分时段用量趋势</h2>
      <div class="panel">
        <div class="panel-head">
          <div class="sub" id="trend-sub">左轴：输入 tokens / 写入周期　右轴：输出 tokens / 写入周期　横轴：时间段</div>
          <select id="trend-range" aria-label="趋势时间范围">
            <option value="60" selected>近一小时</option>
            <option value="720">近12小时</option>
            <option value="1440">近24小时</option>
          </select>
        </div>
        <div class="legend">
          <span><i style="background: var(--cyan)"></i>输入 tokens</span>
          <span><i style="background: var(--green)"></i>输出 tokens</span>
        </div>
        <canvas class="chart" id="chart">浏览器不支持 Canvas。</canvas>
      </div>
    </section>

    <div class="error" id="error"></div>
  </div>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      const fmt = v =>
        Number.isFinite(Number(v))
          ? new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 }).format(v)
          : "--";

      const fmtTokens = v => {
        v = Number(v);
        if (!Number.isFinite(v)) return "--";
        const a = Math.abs(v);
        if (a >= 1e9) return (v / 1e9).toFixed(3) + " B";
        if (a >= 1e6) return (v / 1e6).toFixed(3) + " M";
        if (a >= 1e3) return (v / 1e3).toFixed(3) + " K";
        return v.toFixed(3);
      };

      let history = [];
      let rangeMinutes = 60;
      let lastText = null;
      let lastWidth = null;

      // Per-range display settings: long windows use a trailing moving average
      // so compressed 1-minute noise reads as a smooth trend; 1h stays raw.
      const RANGE_META = {
        60: { smooth: 0, sub: "左轴：输入 tokens / 写入周期　右轴：输出 tokens / 写入周期　横轴：时间段" },
        720: { smooth: 15, sub: "左轴：输入 tokens / 写入周期（15 分钟移动平均）　右轴：输出 tokens / 写入周期（15 分钟移动平均）　横轴：时间段" },
        1440: { smooth: 30, sub: "左轴：输入 tokens / 写入周期（30 分钟移动平均）　右轴：输出 tokens / 写入周期（30 分钟移动平均）　横轴：时间段" },
      };

      function updateModelScroll() {
        const e = $("model");
        const card = e.parentElement;
        const text = e.textContent || "";
        const parentWidth = card ? card.clientWidth : e.clientWidth;
        if (text === lastText && parentWidth === lastWidth) return;
        lastText = text;
        lastWidth = parentWidth;
        e.classList.remove("model-scroll");
        e.style.removeProperty("--model-start");
        e.style.removeProperty("--model-end");
        e.style.width = "100%";
        const overflow = e.scrollWidth - e.clientWidth;
        if (overflow > 1 && card) {
          // Measure while untransformed: element left edge relative to the card border box.
          const leftOffset = e.getBoundingClientRect().left - card.getBoundingClientRect().left;
          const visibleLeft = card.clientLeft;
          const visibleRight = card.clientLeft + card.clientWidth;
          // Start fully hidden on the right, end fully hidden on the left.
          e.style.setProperty("--model-start", `${visibleRight - leftOffset}px`);
          e.style.setProperty("--model-end", `${visibleLeft - leftOffset - e.scrollWidth}px`);
          e.style.width = "max-content";
          e.classList.add("model-scroll");
        }
      }

      function draw() {
        const c = $("chart");
        const r = c.getBoundingClientRect();
        const d = window.devicePixelRatio || 1;
        c.width = r.width * d;
        c.height = r.height * d;
        const x = c.getContext("2d");
        x.setTransform(d, 0, 0, d, 0, 0);
        x.clearRect(0, 0, r.width, r.height);

        // Dual y-axes: each side scales independently to its own series.
        const WINDOW = rangeMinutes * 60 * 1000;
        const now = Date.now();
        const start = now - WINDOW;
        const tOf = p => {
          const t = Number(p.timestamp);
          return Number.isFinite(t) && t > 0 ? (t < 1e12 ? t * 1000 : t) : null;
        };
        // Axis maxima follow the visible window, not the full history.
        let points = history
          .map(p => ({ t: tOf(p), input: Number(p.input_tokens) || 0, output: Number(p.output_tokens) || 0 }))
          .filter(p => p.t !== null && p.t >= start && p.t <= now);
        // Long-range views use a trailing moving average so the compressed
        // 1-minute noise reads as a smooth trend; the 1-hour view stays raw.
        const smoothMinutes = (RANGE_META[rangeMinutes] || RANGE_META[60]).smooth;
        if (smoothMinutes > 1 && points.length > 1) {
          const winMs = smoothMinutes * 60 * 1000;
          let j = 0, sumIn = 0, sumOut = 0;
          const smoothed = [];
          for (let i = 0; i < points.length; i++) {
            sumIn += points[i].input;
            sumOut += points[i].output;
            while (points[j].t < points[i].t - winMs) {
              sumIn -= points[j].input;
              sumOut -= points[j].output;
              j++;
            }
            const n = i - j + 1;
            smoothed.push({ t: points[i].t, input: sumIn / n, output: sumOut / n });
          }
          points = smoothed;
        }
        const maxIn = Math.max(1, ...points.map(p => p.input));
        const maxOut = Math.max(1, ...points.map(p => p.output));

        x.font = "11px monospace";
        x.fillStyle = "#8da1b2";
        x.strokeStyle = "rgba(143, 168, 190, 0.18)";

        // Side margins fit the widest label on each side, keeping the plot area maximal.
        const edge = 2;
        const labelGap = 8;
        const leftLabels = [0, 1, 2, 3, 4].map(i => fmtTokens(maxIn * (1 - i / 4)));
        const rightLabels = [0, 1, 2, 3, 4].map(i => fmtTokens(maxOut * (1 - i / 4)));
        const left = edge + Math.max(...leftLabels.map(s => x.measureText(s).width)) + labelGap;
        const right = edge + Math.max(...rightLabels.map(s => x.measureText(s).width)) + labelGap;
        const bottom = 32;
        const plotRight = r.width - right;
        const w = Math.max(1, plotRight - left);
        const h = Math.max(1, r.height - bottom - 16);
        const xFor = t => left + ((t - start) / WINDOW) * w;

        // Shared horizontal grid lines; left labels for input, right labels for output.
        // Tick labels are tinted with their series color so each axis is
        // identifiable at a glance.
        for (let i = 0; i < 5; i += 1) {
          const y = 12 + (h * i) / 4;
          x.beginPath();
          x.moveTo(left, y);
          x.lineTo(plotRight, y);
          x.stroke();
          x.fillStyle = "#71bad6";
          x.fillText(leftLabels[i], edge, y + 4);
          x.fillStyle = "#67c19d";
          x.fillText(rightLabels[i], plotRight + labelGap, y + 4);
        }
        x.fillStyle = "#8da1b2";

        // Vertical time ticks aligned to real time; they scroll with the window.
        const STEP = WINDOW / 6;
        x.textAlign = "center";
        for (let t = Math.ceil(start / STEP) * STEP; t <= now; t += STEP) {
          const px = xFor(t);
          if (px < left || px > plotRight) continue;
          x.beginPath();
          x.moveTo(px, 12);
          x.lineTo(px, 12 + h);
          x.stroke();
          const dt = new Date(t);
          // Keep the label clear of the "now" marker pinned to the right edge.
          if (px <= plotRight - 55) {
            x.fillText(
              `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`,
              px,
              r.height - 6
            );
          }
        }

        // "Now" marker pinned to the right edge of the axis.
        x.textAlign = "right";
        x.fillText("现在", plotRight, r.height - 6);
        x.textAlign = "left";

        // Data series, each scaled by its own axis maximum.
        const series = [
          ["input", "#71bad6", maxIn],
          ["output", "#67c19d", maxOut]
        ];
        for (const [key, color, max] of series) {
          x.strokeStyle = color;
          x.lineWidth = 2;
          x.beginPath();
          let began = false;
          for (const p of points) {
            const px = xFor(p.t);
            const py = 12 + h * (1 - p[key] / max);
            if (began) {
              x.lineTo(px, py);
            } else {
              x.moveTo(px, py);
              began = true;
            }
          }
          x.stroke();
        }
      }

      function setStatus(stateName, label) {
        $("status").dataset.state = stateName;
        $("status-label").textContent = label;
      }

      async function poll() {
        try {
          const r = await fetch("/api/usage", { cache: "no-store" });
          const p = await r.json();
          if (!r.ok) throw new Error(p.error || "统计功能不可用");
          const u = p.usage || {};
          $("requests").textContent = fmt(u.requests);
          $("input").textContent = fmtTokens(u.input_tokens);
          $("output").textContent = fmtTokens(u.output_tokens);
          $("total").textContent = fmtTokens(u.total_tokens);
          $("cost").textContent = `${fmt(u.total_cost)} ${u.currency || ""}`;
          $("model").textContent = u.model || "unknown";
          $("model").title = u.model || "unknown";
          updateModelScroll();
          history = p.history || [];
          setStatus(p.ok ? "online" : "offline", p.ok ? "在线" : "离线");
          $("error").textContent = u.last_error || "";
          draw();
        } catch (e) {
          setStatus("offline", "离线");
          $("error").textContent = e.message;
        }
      }

      window.addEventListener("resize", () => {
        lastWidth = null;
        updateModelScroll();
        draw();
      });

      $("trend-range").addEventListener("change", e => {
        rangeMinutes = Number(e.target.value) || 60;
        $("trend-sub").textContent = RANGE_META[rangeMinutes].sub;
        draw();
      });

      poll();
      setInterval(poll, 2000);
    })();
  </script>
</body>
</html>
